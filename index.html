<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch Notes</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <!-- ================= MAIN MENU OVERLAY ================= -->
    <div id="main-menu" class="menu-overlay">
        <div class="menu-card">
            <h1 class="app-title">📝 Scratch Notes</h1>
            <p class="app-subtitle">Visual Canvas Note-Taking Inspired by Scratch</p>
            
            <div class="menu-actions">
                <button id="btn-start" class="btn-primary">🚀 Buat Catatan Baru</button>
                <button id="btn-guide" class="btn-secondary">❓ Petunjuk Penggunaan</button>
            </div>

            <!-- PETUNJUK PENGGUNAAN -->
            <div id="guide-box" class="guide-box hidden">
                <h3>Cara Menggunakan:</h3>
                <ul>
                    <li>🟡 <b>Navigasi:</b> Klik kanan tahan + <i>drag</i> pada kanvas untuk menggeser view.</li>
                    <li>🔵 <b>Blok Catatan:</b> Klik tombol "+" di kiri atas untuk nambah catatan.</li>
                    <li>🟣 <b>Koneksi:</b> Tarik garis antar dot biru untuk menghubungkan ide.</li>
                </ul>
            </div>
        </div>
    </div>
    <!-- ===================================================== -->

    <!-- Tombol Add Block Melayang (Kiri Atas) -->
    <button id="add-block-btn" class="ui-add-btn">
        <img src="Scratch Note/Add Block.png" alt="Add Block +">
    </button>

    <!-- Viewport dan Kanvas Utama -->
    <div class="viewport" id="viewport">
        <div class="canvas" id="canvas">
            <!-- SVG Layer untuk Garis Penghubung -->
            <svg class="svg-layer" id="svg-connections" width="100%" height="100%"></svg>
            
            <!-- Blok Note akan dimuat ke sini -->
        </div>
    </div>

    <script src="Function.js"></script>
</body>
</html>
