<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. MAIN MENU / LANDING PAGE OVERLAY -->
  <div id="main-menu" class="menu-overlay">
    <div class="menu-card">
      <h1 class="app-title">📝 Scratch Notes</h1>
      <p class="app-subtitle">Visual Canvas Note-Taking Inspired by Scratch</p>
      
      <div class="menu-actions">
        <button id="btn-start" class="btn-primary">🚀 Buat Catatan Baru</button>
        <button id="btn-guide" class="btn-secondary">❓ Petunjuk Penggunaan</button>
      </div>

      <!-- PETUNJUK PENGGUNAAN -->
      <div id="guide-box" class="guide-box hidden">
        <h3>Cara Menggunakan:</h3>
        <ul>
          <li>🟡 <b>Navigasi:</b> Drag pada area kanvas kosong untuk menggeser view.</li>
          <li>🔵 <b>Blok Catatan:</b> Klik tombol "+ Catatan Baru" di atas.</li>
          <li>🟣 <b>Asset:</b> File gambar/folder tambahan tetap aman tersimpan.</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- 2. TOOLBAR ATAS (Hanya tampil setelah masuk kanvas) -->
  <div id="toolbar">
    <h2>📝 Scratch Notes</h2>
    <div style="display: flex; gap: 10px;">
      <button id="btn-back-menu" class="btn-secondary" style="padding: 6px 12px; font-size: 0.9rem; cursor: pointer;">🏠 Menu</button>
      <button id="btn-add-note" class="btn-add">+ Catatan Baru</button>
    </div>
  </div>

  <!-- 3. KANVAS UTAMA CATATAN -->
  <div id="canvas-container">
    <div id="note-board"></div>
  </div>

  <script src="function.js"></script>
</body>
</html>
